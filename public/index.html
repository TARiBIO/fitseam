<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F5F1EA" />
    <meta name="description" content="Find your real size at any brand. Fit intelligence for real bodies — denim, dresses, bikinis." />

    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Social preview. Two rules these tags exist to satisfy:
         1. og:image must be an ABSOLUTE https URL — scrapers do not resolve
            root-relative paths, so "%PUBLIC_URL%/..." silently yields no image.
         2. It must be a PNG or JPEG at 1200x630. SVG is rejected by Facebook,
            X, LinkedIn and iMessage alike.
         og-image.svg remains the editable master; og-image.png is rendered
         from it. Regenerate the PNG whenever the SVG changes. -->
    <link rel="canonical" href="https://www.fitseam.co/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.fitseam.co/" />
    <meta property="og:site_name" content="Fitseam" />
    <meta property="og:title" content="Fitseam — Find your real size" />
    <meta property="og:description" content="Fit intelligence for real bodies. Get your exact size at any brand — denim, dresses, bikinis." />
    <meta property="og:image" content="https://www.fitseam.co/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fitseam — your size didn't change, the clothes did." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fitseam — Find your real size" />
    <meta name="twitter:description" content="Fit intelligence for real bodies. Get your exact size at any brand — denim, dresses, bikinis." />
    <meta name="twitter:image" content="https://www.fitseam.co/og-image.png" />
    <meta name="twitter:image:alt" content="Fitseam — your size didn't change, the clothes did." />

    <title>Fitseam — Find your real size</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  </head>
  <body>

    <div id="root"></div>
  </body>
</html>
